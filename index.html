<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2348b7">
<title>Student Monitoring System</title>
<style>
:root{--blue:#2348b7;--blue-dark:#19368f;--paper:#f2f1eb;--line:#b9b8b0;--ink:#292929}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#e8ebf2;color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding:24px 12px}
.phone{width:min(100%,390px);min-height:720px;background:var(--paper);border:7px solid #252b38;border-radius:34px;overflow:hidden;box-shadow:0 18px 48px #101a3b30}
.status{height:27px;background:#17318e;color:white;display:flex;justify-content:flex-end;align-items:center;gap:7px;padding:0 14px;font-size:12px}
.status .time{margin-left:auto}
.toolbar{height:61px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 5px #0002}
.toolbar h1{font-size:21px;font-weight:500;margin:0}.menu{font-size:24px;color:white;border:0;background:transparent;cursor:pointer;padding:4px 0 4px 12px}
main{padding:10px 9px 20px}
.heading{height:34px;border:1px solid #aaa99f;background:#e9e8e0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:600;margin-bottom:8px}
.stats{border:1px solid var(--line);background:#eeede7;padding:7px 9px;margin-bottom:6px;font-size:13px;line-height:1.35}
.stats p{margin:4px 0}.number{font-weight:500}
.picture{width:55px;height:55px;border:1px solid #aaa99f;background:#f0efe9;margin:6px auto 8px;display:grid;place-items:center;border-radius:2px}
.picture svg{width:35px;height:35px}
.actions{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:2px}
.actions button{min-height:37px;padding:8px 14px;min-width:174px;max-width:100%;font-size:12px;background:#e8e7df;border:1px solid #aaa99f;color:#333;box-shadow:0 1px 2px #0001;cursor:pointer}
.actions button:last-child{min-width:204px}
button:hover{background:#deddd5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8aa8ff;outline-offset:2px}
.panel{display:none;margin-top:14px;padding:13px;border:1px solid var(--line);background:#faf9f4}.panel.active{display:block}.panel h2{font-size:17px;margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-size:13px}.field input,.field select{width:100%;padding:10px;border:1px solid #aaa;background:white;font-size:14px}
.primary,.secondary{width:100%;min-height:38px;padding:9px;border:1px solid #aaa;background:#e8e7df;cursor:pointer}.primary{background:var(--blue);color:white;border-color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ddd;font-size:13px}.row button{padding:5px 8px;border:1px solid #aaa;background:#e8e7df;cursor:pointer}.muted{font-size:12px;color:#666}.foot{text-align:center;font-size:11px;color:#777;padding:18px 0 3px}
@media(max-width:420px){body{padding:0;background:var(--paper)}.phone{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}.status{height:25px}}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span class="time">12:30</span><span>◆</span><span>◕</span><span>▰</span></div>
  <header class="toolbar"><h1>Screen1</h1><button class="menu" id="menuBtn" aria-label="Menu">⋮</button></header>
  <main>
    <div class="heading">STUDENT MONITORING SYSTEM</div>
    <section class="stats" aria-live="polite">
      <p>TOTAL STUDENTS: <span class="number" id="total">0</span></p>
      <p>PRESENT: <span class="number" id="present">0</span></p>
      <p>ABSENT: <span class="number" id="absent">0</span></p>
    </section>
    <div class="picture" aria-label="Image placeholder">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="3" fill="#33383d"/><circle cx="27" cy="13" r="4" fill="#eee"/><path d="M5 32 15 20l6 7 5-5 9 10Z" fill="#eee"/></svg>
    </div>
    <div class="actions">
      <button data-panel="studentPanel">STUDENT INFORMATION</button>
      <button data-panel="attendancePanel">RECORD ATTENDANCE</button>
      <button data-panel="reportPanel">VIEW ATTENDANCE REPORT</button>
    </div>
    <section class="panel" id="studentPanel">
      <h2>Student Information</h2>
      <form id="studentForm">
        <label class="field">Student ID<input id="studentId" required placeholder="e.g. 2026-001"></label>
        <label class="field">Full Name<input id="studentName" required placeholder="Enter student's full name"></label>
        <label class="field">Course / Section<input id="studentSection" placeholder="e.g. BSIT-3A"></label>
        <button class="primary" type="submit">ADD STUDENT</button>
      </form>
      <div id="studentList"></div>
    </section>
    <section class="panel" id="attendancePanel">
      <h2>Record Attendance</h2>
      <label class="field">Select Student<select id="attendanceStudent"><option value="">Add a student first</option></select></label>
      <label class="field">Attendance Status<select id="attendanceStatus"><option>Present</option><option>Absent</option></select></label>
      <label class="field">Date<input type="date" id="attendanceDate" required></label>
      <button class="primary" id="saveAttendance" type="button">SAVE ATTENDANCE</button>
    </section>
    <section class="panel" id="reportPanel">
      <h2>Attendance Report</h2>
      <label class="field">Filter by date<input type="date" id="reportDate"></label>
      <div id="reportRows"><p class="muted">No attendance records yet.</p></div>
      <button class="secondary" id="clearFilter" type="button">SHOW ALL RECORDS</button>
    </section>
    <div class="foot">Student Monitoring System</div>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
let students=[],records=[];
try{students=JSON.parse(localStorage.getItem('sms_students')||'[]');records=JSON.parse(localStorage.getItem('sms_records')||'[]')}catch(e){students=[];records=[]}
const today=()=>new Date().toISOString().slice(0,10);
$('attendanceDate').value=today();$('reportDate').value=today();
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('sms_students',JSON.stringify(students));localStorage.setItem('sms_records',JSON.stringify(records));render()}
function render(){
 $('total').textContent=students.length;
 const todayRecords=records.filter(r=>r.date===today());
 $('present').textContent=todayRecords.filter(r=>r.status==='Present').length;
 $('absent').textContent=todayRecords.filter(r=>r.status==='Absent').length;
 $('attendanceStudent').innerHTML=students.length?'<option value="">Choose a student</option>'+students.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' ('+esc(s.id)+')</option>').join(''):'<option value="">Add a student first</option>';
 $('studentList').innerHTML=students.length?'<h2 style="margin-top:18px">Registered Students</h2>'+students.map(s=>'<div class="row"><span>'+esc(s.name)+'<br><small>'+esc(s.id)+' · '+esc(s.section||'No section')+'</small></span><button type="button" data-delete="'+esc(s.id)+'">Remove</button></div>').join(''):'<p class="muted">No students added yet.</p>';
 const date=$('reportDate').value;const list=records.filter(r=>!date||r.date===date).slice().reverse();
 $('reportRows').innerHTML=list.length?list.map(r=>{const s=students.find(x=>x.id===r.studentId);return '<div class="row"><span><strong>'+esc(s?s.name:r.studentId)+'</strong><br><small>'+esc(r.date)+'</small></span><span>'+esc(r.status)+'</span></div>'}).join(''):'<p class="muted">No attendance records for this date.</p>';
}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(b.dataset.panel).classList.add('active');$(b.dataset.panel).scrollIntoView({behavior:'smooth',block:'nearest'})}));
$('studentForm').addEventListener('submit',e=>{e.preventDefault();const id=$('studentId').value.trim();if(students.some(s=>s.id.toLowerCase()===id.toLowerCase())){alert('That student ID already exists.');return}students.push({id,name:$('studentName').value.trim(),section:$('studentSection').value.trim()});e.target.reset();save()});
$('studentList').addEventListener('click',e=>{const id=e.target.dataset.delete;if(!id)return;if(confirm('Remove this student and their attendance records?')){students=students.filter(s=>s.id!==id);records=records.filter(r=>r.studentId!==id);save()}});
$('saveAttendance').addEventListener('click',()=>{const studentId=$('attendanceStudent').value,date=$('attendanceDate').value,status=$('attendanceStatus').value;if(!studentId){alert('Please add and select a student first.');return}if(!date){alert('Please select a date.');return}const i=records.findIndex(r=>r.studentId===studentId&&r.date===date);const record={studentId,date,status};if(i>=0)records[i]=record;else records.push(record);save();alert('Attendance saved!')});
$('reportDate').addEventListener('change',render);$('clearFilter').addEventListener('click',()=>{$('reportDate').value='';render()});$('menuBtn').addEventListener('click',()=>alert('Student Monitoring System\nUse the buttons to manage students and attendance.'));
render();
</script>
</body>
</html>
